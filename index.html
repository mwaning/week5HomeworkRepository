<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body>
    <h1>Simple Calculator</h1>
    <div>
      <input type="number" name="numberInputOne" id="numberInputOne" />
      <select name="expressions" id="expressions">
        <option value="add">+</option>
        <option value="subtract">-</option>
        <option value="multiply">*</option>
        <option value="divide">/</option>
      </select>
      <input type="number" name="numberInputTwo" id="numberInputTwo" />
      <input type="button" value="Calculate" class="button" id="button" />
      <p id="answer"></p>
    </div>

    <script src="app/app.js"></script>
  </body>
</html>
